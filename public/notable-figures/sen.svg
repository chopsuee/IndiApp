<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-sen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9933;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b34d00;stop-opacity:1" />
    </linearGradient>
    <pattern id="pattern-sen" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#138808" opacity="0.15"/>
    </pattern>
    <radialGradient id="radial-sen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#138808;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FF9933;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Base gradient -->
  <rect width="400" height="400" fill="url(#grad-sen)"/>
  
  <!-- Subtle pattern overlay -->
  <rect width="400" height="400" fill="url(#pattern-sen)"/>
  
  <!-- Radial highlight -->
  <circle cx="200" cy="200" r="200" fill="url(#radial-sen)"/>
  
  <!-- Decorative circle -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#138808" stroke-width="2" opacity="0.2"/>
  
  <!-- Initials -->
  <text x="200" y="200" font-family="'Noto Serif', Georgia, serif" font-size="140" font-weight="bold" 
        fill="white" text-anchor="middle" dominant-baseline="middle" 
        style="text-shadow: 0 4px 12px rgba(0,0,0,0.3);">
    AS
  </text>
  
  <!-- Name -->
  <text x="200" y="340" font-family="'Noto Sans', Arial, sans-serif" font-size="22" font-weight="600"
        fill="white" text-anchor="middle" opacity="0.95"
        style="text-shadow: 0 2px 8px rgba(0,0,0,0.3);">
    Amartya Sen
  </text>
</svg>