<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-teresa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8E8;stop-opacity:1" />
    </linearGradient>
    <pattern id="pattern-teresa" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#000080" opacity="0.1"/>
    </pattern>
    <radialGradient id="radial-teresa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#000080;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Base gradient -->
  <rect width="400" height="400" fill="url(#grad-teresa)"/>
  
  <!-- Subtle pattern overlay -->
  <rect width="400" height="400" fill="url(#pattern-teresa)"/>
  
  <!-- Radial highlight -->
  <circle cx="200" cy="200" r="200" fill="url(#radial-teresa)"/>
  
  <!-- Decorative circles (representing her blue-bordered sari) -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#000080" stroke-width="3" opacity="0.3"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#000080" stroke-width="1" opacity="0.2"/>
  
  <!-- Initials -->
  <text x="200" y="200" font-family="'Noto Serif', Georgia, serif" font-size="140" font-weight="bold" 
        fill="#000080" text-anchor="middle" dominant-baseline="middle" 
        style="text-shadow: 0 2px 8px rgba(0,0,128,0.2);">
    MT
  </text>
  
  <!-- Name -->
  <text x="200" y="340" font-family="'Noto Sans', Arial, sans-serif" font-size="22" font-weight="600"
        fill="#000080" text-anchor="middle" opacity="0.9"
        style="text-shadow: 0 1px 4px rgba(0,0,128,0.1);">
    Mother Teresa
  </text>
</svg>